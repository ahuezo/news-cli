name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Tests
        run: go test ./...

      - name: Build CLI
        run: go build -o telecom-news .

      - name: Validate Catalogs
        run: ./telecom-news validate

      - name: Validate Sources Schema
        run: ./telecom-news validate-schema sources internal/crawler/sources.json

      - name: Validate Auth Schema
        run: ./telecom-news validate-schema auth examples/auth_sources.override.example.json
